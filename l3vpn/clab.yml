name: evpn-l3vpn
topology:
  nodes:
    # Leaf
    N1:
      kind: linux
      image: lab_frr:10.0.0
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/N1.conf:/etc/frr/frr.conf
        - configs/N1-start.sh:/start.sh
      exec:
        - bash /start.sh

    N2:
      kind: linux
      image: lab_frr:10.0.0
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/N2.conf:/etc/frr/frr.conf
        - configs/N2-start.sh:/start.sh
      exec:
        - bash /start.sh

# Other
    R1:
      kind: linux
      image: lab_frr:10.0.0
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/R1.conf:/etc/frr/frr.conf
      #   - configs/R1-start.sh:/start.sh
      # exec:
      #   - bash /start.sh

    R2:
      kind: linux
      image: lab_frr:10.0.0
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/R2.conf:/etc/frr/frr.conf
      #   - configs/R2-start.sh:/start.sh
      # exec:
      #   - bash /start.sh

    sw01:
      kind: linux
      image: wbitt/network-multitool:latest
      exec:
        - ip link set eth0 down
        - ip link add br0 type bridge
        - ip link set dev br0 up
        - ip link set dev eth1 master br0
        - ip link set dev eth2 master br0
        - ip link set dev br0 down

        
  links:
    # fabric
    - endpoints: ["N1:eth1", "sw01:eth1"]
    - endpoints: ["N2:eth1", "sw01:eth2"]
      
    # extarnal
    - endpoints: ["N1:eth2", "R1:eth1"]      
    - endpoints: ["N2:eth2", "R2:eth1"]      
